<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Todo App</title>
</head>
<body>
    <p>ini tambahan</p>
    <div class="navbar">
        <div class="element">
            <h3>ToDo Apps</h3>
            <p>Upgrade Your Self</p>
        </div>
        <p>🔎 Search</p>
        <p>🔔 Notification</p>
        <p>🙎Profile</p>
    </div>
    <div class="head">
        <div class="icon">
            🎖️
        </div>
        <div id="head-search" class="head-search">
            <h3>Add A New Task</h3>
            <div>
                <input id="add-task" class="add-task" placeholder="Add task...">
                <button id="add" class="add">Tambah +</button>
            </div>
        </div>
    </div>
    <div class="category">
        <div id="allTodo" class="all"></div>
        <div id="doneTodo" class="done"></div>
        <div id="notyet" class="not-yet"></div>
    </div>
    <div id="clear" class="clear">
        <button class="h-clr">🗑️</button>
        <h4>Clear All</h4>
    </div>
    <script src="script.js"></script>
</body>
<footer>ini footer tambahan</footer>
</html>
